server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:public}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:604800000}

app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap-admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:User}
app.bootstrap-test-users.enabled=${APP_BOOTSTRAP_TEST_USERS_ENABLED:false}
app.bootstrap-test-users.count=${APP_BOOTSTRAP_TEST_USERS_COUNT:0}
app.bootstrap-test-users.password=${APP_BOOTSTRAP_TEST_USERS_PASSWORD:}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:15MB}

qpay.base-url=${QPAY_BASE_URL:https://merchant.qpay.mn/v2}
qpay.username=${QPAY_USERNAME:}
qpay.password=${QPAY_PASSWORD:}
qpay.invoice-code=${QPAY_INVOICE_CODE:}
qpay.callback-url=${QPAY_CALLBACK_URL:}
qpay.exam-fee=${EJU_EXAM_FEE:70000}
